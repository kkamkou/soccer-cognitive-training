<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cognitive Training</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stick+No+Bills:wght@200..800&display=swap">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Component Templates -->
    <template id="number-display-template">
        <div 
            class="number" 
            :style="{ color: textColor, textShadow: textShadow }"
            @dblclick="$emit('toggle-fullscreen')"
        >
            {{ number }}
        </div>
    </template>

    <template id="cone-display-template">
        <div class="cone-container" @dblclick="$emit('toggle-fullscreen')">
            <div class="cone" :style="{ borderBottomColor: color }"></div>
        </div>
    </template>

    <template id="zone-display-template">
        <div class="zone-container" @dblclick="$emit('toggle-fullscreen')">
            <div class="zone-rectangle" :style="rectangleStyle"></div>
        </div>
    </template>

    <template id="settings-trigger-template">
        <button 
            class="settings-trigger" 
            @click="$emit('open-settings')"
        ></button>
    </template>

    <template id="settings-panel-template">
        <div class="settings-panel">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-btn" @click="$emit('close')">&times;</button>
            </div>
            
            <div class="setting-group">
                <label>Interval (seconds)</label>
                <input 
                    type="number" 
                    :value="intervalSeconds"
                    @change="$emit('update-interval', parseFloat($event.target.value))"
                    min="1"
                    max="60"
                    step="0.5"
                >
                <div class="setting-info">Change how often the number updates (1-60 seconds)</div>
            </div>
            
            <div class="setting-group">
                <label>Show Numbers</label>
                <div class="checkbox-wrapper">
                    <input 
                        type="checkbox" 
                        :checked="showNumbersEnabled"
                        @change="$emit('toggle-numbers', $event.target.checked)"
                        id="numberToggle"
                    >
                    <label for="numberToggle">Show numbers</label>
                </div>
                <div class="setting-info">When enabled, numbers will appear</div>
            </div>

            <div class="setting-group">
                <label>Numbers probability (%)</label>
                <input 
                    type="number" 
                    :value="numberProbability"
                    @change="$emit('update-number-probability', parseInt($event.target.value, 10))"
                    :disabled="!showNumbersEnabled"
                    min="0"
                    max="100"
                    step="1"
                >
            </div>

            <div class="setting-group">
                <label>Show Cones</label>
                <div class="checkbox-wrapper">
                    <input 
                        type="checkbox" 
                        :checked="showConesEnabled"
                        @change="$emit('toggle-cones', $event.target.checked)"
                        id="coneToggle"
                    >
                    <label for="coneToggle">Sometimes show colored cones</label>
                </div>
                <div class="setting-info">When enabled, colored cones will randomly appear instead of numbers</div>
            </div>

            <div class="setting-group">
                <label>Cones probability (%)</label>
                <input 
                    type="number" 
                    :value="coneProbability"
                    @change="$emit('update-cone-probability', parseInt($event.target.value, 10))"
                    :disabled="!showConesEnabled"
                    min="0"
                    max="100"
                    step="1"
                >
            </div>

            <div class="setting-group">
                <label>Zones of the Goal</label>
                <div class="checkbox-wrapper">
                    <input 
                        type="checkbox" 
                        :checked="showZonesEnabled"
                        @change="$emit('toggle-zones', $event.target.checked)"
                        id="zoneToggle"
                    >
                    <label for="zoneToggle">Show zones of the goal</label>
                </div>
                <div class="setting-info">When enabled, the screen is divided into goal zones</div>
            </div>

            <div class="setting-group">
                <label>Zones probability (%)</label>
                <input 
                    type="number" 
                    :value="zoneProbability"
                    @change="$emit('update-zone-probability', parseInt($event.target.value, 10))"
                    :disabled="!showZonesEnabled"
                    min="0"
                    max="100"
                    step="1"
                >
            </div>
        </div>
    </template>

    <div id="app">
        <number-display v-if="contentType === 'number'"
            :number="currentNumber"
            :text-color="textColor"
            :text-shadow="textShadow"
            @toggle-fullscreen="toggleFullscreen"></number-display>

        <cone-display v-else-if="contentType === 'cone'"
            :color="currentConeColor"
            @toggle-fullscreen="toggleFullscreen"></cone-display>

        <zone-display v-else-if="contentType === 'zone'"
            :color="currentZoneColor"
            :position="currentZone.style"
            @toggle-fullscreen="toggleFullscreen"></zone-display>
        
        <settings-trigger @open-settings="settingsOpen = true"></settings-trigger>
        
        <settings-panel v-if="settingsOpen"
            :interval-seconds="intervalSeconds"
            :show-numbers-enabled="showNumbersEnabled"
            :show-cones-enabled="showConesEnabled"
            :show-zones-enabled="showZonesEnabled"
            :number-probability="numberProbability"
            :cone-probability="coneProbability"
            :zone-probability="zoneProbability"
            @close="settingsOpen = false"
            @update-interval="updateInterval"
            @toggle-numbers="toggleType('number', $event)"
            @toggle-cones="toggleType('cone', $event)"
            @toggle-zones="toggleType('zone', $event)"
            @update-number-probability="updateProbability('number', $event)"
            @update-cone-probability="updateProbability('cone', $event)"
            @update-zone-probability="updateProbability('zone', $event)"></settings-panel>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
